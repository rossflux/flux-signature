<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux Signature Generator</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px; color: #2d3748; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  label { display: block; font-size: 12px; font-weight: bold; margin: 10px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; border: 1px solid #cbd5e0; border-radius: 4px; }
  button { background: #009999; color: #fff; border: 0; padding: 10px 18px; font-size: 14px; border-radius: 4px; cursor: pointer; margin-top: 14px; }
  #msg { margin-left: 10px; font-size: 13px; color: #009999; }
  ol { font-size: 13px; line-height: 1.6; padding-left: 20px; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Flux Broadcast – Gmail signature</h1>
  <div class="card">
    <label>Full name</label><input id="name" placeholder="e.g. Jane Smith">
    <label>Pronouns (optional)</label><input id="pronouns" placeholder="Optional, e.g. She/Her. Leave blank to omit">
    <label>Job title</label><input id="title" placeholder="e.g. Production Account Manager, Technical Producer">
    <label>Email</label><input id="email" placeholder="firstname.lastname@fluxbroadcast.com">
    <label>Phone</label><input id="phone" placeholder="e.g. 07123456789">
    <button id="copy">Copy signature</button><span id="msg"></span>
  </div>
  <div class="card"><div id="preview"></div></div>
  <div class="card">
    <ol>
      <li>Fill in your details and click <b>Copy signature</b>.</li>
      <li>Gmail → Settings (cog) → <b>See all settings</b> → General → Signature.</li>
      <li>Create new, name it, click in the box and paste (Ctrl/Cmd + V).</li>
      <li>Set it as default for new emails and replies, then Save Changes.</li>
    </ol>
  </div>
</div>

<script>
const LOGO = "https://fluxbroadcast.com/wp-content/uploads/2026/06/FluxLogo-Email-1.png"; // host this on your own domain

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function build(v) {
  const phoneHref = v.phone.replace(/[^+\d]/g, "");
  return `<table style="max-width:550px;font-family:Arial,sans-serif;color:#2d3748;line-height:1.4;border-collapse:collapse;" border="0" width="100%" cellspacing="0" cellpadding="0"><tbody><tr><td style="padding:0;">
<table border="0" cellspacing="0" cellpadding="0"><tbody>
<tr><td style="font-weight:bold;font-size:16px;padding-bottom:4px;font-family:Arial,sans-serif;color:#2d3748;">${esc(v.name)}${v.pronouns.trim() ? ' <span style="font-size:11px;font-weight:normal;color:#2d3748;">(' + esc(v.pronouns.trim()) + ')</span>' : ""}</td></tr>
<tr><td style="color:#009999;font-size:13px;padding-bottom:2px;font-family:Arial,sans-serif;white-space:nowrap;">${esc(v.title)}</td></tr>
<tr><td style="font-size:12px;padding-bottom:2px;font-family:Arial,sans-serif;"><a style="color:#999999;text-decoration:none;" href="mailto:${esc(v.email)}">${esc(v.email)}</a></td></tr>
<tr><td style="font-size:12px;padding-bottom:2px;font-family:Arial,sans-serif;"><a style="color:#999999;text-decoration:none;" href="tel:${esc(phoneHref)}">${esc(v.phone)}</a></td></tr>
<tr><td style="font-size:12px;padding-bottom:2px;font-family:Arial,sans-serif;"><strong><a style="color:#999999;text-decoration:none;" href="https://fluxbroadcast.com" target="_blank">fluxbroadcast.com</a></strong></td></tr>
<tr><td style="font-size:12px;padding-bottom:2px;font-family:Arial,sans-serif;color:#999999;">Unit C2 Connaught Business Centre, 6-14 Malham Road, Forest Hill, SE23 1AG</td></tr>
</tbody></table>
<table style="margin-top:14px;" border="0" cellspacing="0" cellpadding="0"><tbody><tr><td><a href="https://fluxbroadcast.com" target="_blank"><img src="${LOGO}" alt="Flux Broadcast" width="100" style="width:100px;height:auto;border:0;display:block;"></a></td></tr></tbody></table>
<table style="margin-top:14px;" border="0" cellspacing="0" cellpadding="0"><tbody><tr><td style="width:34px;vertical-align:middle;" width="34"><a href="https://www.linkedin.com/company/flux-broadcast" target="_blank"><img src="https://fluxbroadcast.com/wp-content/uploads/2026/10/linkedin@2x.png" alt="LinkedIn" width="24" height="24" border="0" style="width:24px;height:24px;border:0;display:block;"></a></td><td style="width:34px;vertical-align:middle;" width="34"><a href="https://www.instagram.com/fluxbroadcast/" target="_blank"><img src="https://fluxbroadcast.com/wp-content/uploads/2026/10/instagram@2x.png" alt="Instagram" width="24" height="24" border="0" style="width:24px;height:24px;border:0;display:block;"></a></td></tr></tbody></table>
<table style="margin-top:14px;" border="0" width="100%" cellspacing="0" cellpadding="0"><tbody><tr><td style="font-size:11px;color:#6c737f;font-family:Arial,sans-serif;line-height:1.4;">This email and any attachments are confidential and intended solely for the use of the addressee. If you are not the intended recipient, please notify the sender immediately and delete this email. The views or opinions expressed in this email are those of the sender and do not necessarily represent those of the company.</td></tr></tbody></table>
</td></tr></tbody></table>`;
}

const ids = ["name","pronouns","title","email","phone"];
const fallback = {name:"Your Name", pronouns:"", title:"Your Job Title", email:"your.name@fluxbroadcast.com", phone:"Your phone number"};
const raw = () => Object.fromEntries(ids.map(i => [i, document.getElementById(i).value.trim()]));
const vals = () => Object.fromEntries(Object.entries(raw()).map(([k,v]) => [k, v || fallback[k]]));
const prev = document.getElementById("preview");
const render = () => { prev.innerHTML = build(vals()); };
ids.forEach(i => document.getElementById(i).addEventListener("input", render));
render();

document.getElementById("copy").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  const r0 = raw();
  if (!r0.name || !r0.title || !r0.email || !r0.phone) { msg.style.color = "#c53030"; msg.textContent = "Please fill in name, job title, email and phone first."; return; }
  msg.style.color = "#009999";
  const html = build(vals());
  try {
    await navigator.clipboard.write([new ClipboardItem({
      "text/html": new Blob([html], {type: "text/html"}),
      "text/plain": new Blob([prev.innerText], {type: "text/plain"})
    })]);
    msg.textContent = "Copied – now paste into Gmail.";
  } catch (e) {
    const r = document.createRange(); r.selectNode(prev);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand("copy"); s.removeAllRanges();
    msg.textContent = "Copied – now paste into Gmail.";
  }
});
</script>
</body>
</html>
